name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Install Chromium for verify
        run: npx playwright install --with-deps chromium
      - name: Verify (web export, every route renders clean, feature flows pass)
        run: npm run verify
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-shots
          path: e2e/shots/
          if-no-files-found: ignore
