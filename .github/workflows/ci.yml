name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: iOS bundle builds (what Expo Go loads; the web export below does not cover it)
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-export"
      - name: Install Chromium for verify
        run: npx playwright install --with-deps chromium
      - name: Verify (web export, every route renders clean, feature flows pass)
        run: npm run verify
      - name: Verify API mode (web export with the API URL set; the API is mocked, then unreachable)
        run: npm run verify:api
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-shots
          path: e2e/shots/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kalo
          POSTGRES_PASSWORD: kalo
          POSTGRES_DB: kalo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalo -d kalo" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://kalo:kalo@localhost:5432/kalo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head
      - name: Tests (mapping, downloads, and the database path against the Postgres service)
        run: uv run pytest
