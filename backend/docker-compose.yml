services:
  db:
    image: postgres:17-alpine
    container_name: kalo-db
    environment:
      POSTGRES_USER: kalo
      POSTGRES_PASSWORD: kalo
      POSTGRES_DB: kalo
    ports:
      - "127.0.0.1:5432:5432" # local only: the dev password is trivial
    volumes:
      - kalo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalo -d kalo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kalo-db-data:
